<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARTA DESA - Media Digital Warga</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root { --p: #064e3b; --s: #10b981; --bg: #f3f4f6; --text: #1f2937; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Navbar */
        nav { background: var(--p); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 800; cursor: pointer; }
        .admin-link { color: rgba(255,255,255,0.3); cursor: pointer; font-size: 0.8rem; text-decoration: none; }

        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }

        /* Dashboard Admin Terpadu */
        #admin-panel { 
            display: none; 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            margin-bottom: 40px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-top: 5px solid var(--s);
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #f9fafb; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #eee; }
        .stat-card h4 { margin: 0; color: #6b7280; font-size: 0.8rem; }
        .stat-card p { margin: 5px 0 0 0; font-size: 1.5rem; font-weight: bold; color: var(--p); }

        /* Tab System */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background: none; cursor: pointer; font-weight: 600; color: #6b7280; }
        .tab-btn.active { color: var(--p); border-bottom: 2px solid var(--p); }

        /* Forms & Table */
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f9fafb; padding: 12px; font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .btn-del { color: #ef4444; border: none; background: none; cursor: pointer; font-size: 1rem; }
        .btn-pub { background: var(--p); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* News Feed */
        .news-card { background: white; border-radius: 15px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .news-card img { width: 100%; height: 300px; object-fit: cover; }
        .news-body { padding: 25px; }
        .news-title { font-size: 1.6rem; margin: 10px 0; color: var(--p); }
        .news-meta { font-size: 0.8rem; color: #9ca3af; margin-bottom: 15px; }
        
        #full-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="location.reload()">WARTA DESA</div>
    <div class="admin-link" onclick="masukAdmin()"><i class="fas fa-user-shield"></i> Portal Wartawan</div>
</nav>

<div class="container">
    <div id="admin-panel">
        <div class="admin-header">
            <h2 style="margin:0;"><i class="fas fa-tachometer-alt"></i> Panel Kontrol Admin</h2>
            <button onclick="keluarAdmin()" style="cursor:pointer; padding:5px 15px;">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>Total Berita</h4>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h4>Status Server</h4>
                <p style="font-size: 1rem; color: #10b981;">Online</p>
            </div>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" id="tab-tulis" onclick="setTab('tulis')">Tulis Berita</button>
            <button class="tab-btn" id="tab-kelola" onclick="setTab('kelola')">Kelola Berita</button>
        </div>

        <div id="section-tulis">
            <div class="form-group">
                <input type="text" id="jIn" placeholder="Judul liputan utama...">
            </div>
            <div class="form-group">
                <label style="font-size: 0.8rem;">Unggah Foto Kegiatan:</label>
                <input type="file" id="fIn" accept="image/*">
            </div>
            <div class="form-group">
                <textarea id="iIn" rows="8" placeholder="Tuliskan berita lengkap (5W+1H)..."></textarea>
            </div>
            <button class="btn-pub" onclick="post()">Terbitkan Berita Sekarang</button>
        </div>

        <div id="section-kelola" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>Judul Berita</th>
                        <th>Tanggal</th>
                        <th style="text-align:center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="admin-list">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="news-feed"></div>
</div>

<div id="full-view">
    <div class="container" style="max-width: 700px;">
        <button onclick="tutupBaca()" style="margin-bottom:20px; cursor:pointer;">&larr; Kembali</button>
        <div id="full-content"></div>
    </div>
</div>

<script>
    let imgStore = "";
    const PASS = "ciamis123"; // Password kamu

    // Handle Image
    document.getElementById('fIn').addEventListener('change', function(e) {
        let r = new FileReader();
        r.onload = () => imgStore = r.result;
        if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
    });

    function masukAdmin() {
        if(prompt("Kode Akses:") === PASS) {
            sessionStorage.setItem('admin', 'yes');
            init();
        } else { alert("Akses ditolak!"); }
    }

    function keluarAdmin() {
        sessionStorage.removeItem('admin');
        location.reload();
    }

    function setTab(type) {
        document.getElementById('section-tulis').style.display = type === 'tulis' ? 'block' : 'none';
        document.getElementById('section-kelola').style.display = type === 'kelola' ? 'block' : 'none';
        document.getElementById('tab-tulis').className = `tab-btn ${type === 'tulis' ? 'active' : ''}`;
        document.getElementById('tab-kelola').className = `tab-btn ${type === 'kelola' ? 'active' : ''}`;
        if(type === 'kelola') renderAdminTable();
    }

    function post() {
        let j = document.getElementById('jIn').value;
        let i = document.getElementById('iIn').value;
        if(!j || !i) return alert("Isi judul dan konten!");

        let db = JSON.parse(localStorage.getItem('warta_final_db')) || [];
        db.unshift({ 
            id: Date.now(), 
            j, i, 
            f: imgStore || 'https://via.placeholder.com/800x400?text=Warta+Desa', 
            t: new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'}) 
        });
        localStorage.setItem('warta_final_db', JSON.stringify(db));
        alert("Berita berhasil terbit!");
        location.reload();
    }

    function renderAdminTable() {
        let db = JSON.parse(localStorage.getItem('warta_final_db')) || [];
        let html = '';
        db.forEach((item, index) => {
            html += `<tr>
                <td>${item.j}</td>
                <td>${item.t}</td>
                <td style="text-align:center;">
                    <button class="btn-del" onclick="hapus(${index})"><i class="fas fa-trash-alt"></i></button>
                </td>
            </tr>`;
        });
        document.getElementById('admin-list').innerHTML = html || '<tr><td colspan="3" style="text-align:center;">Belum ada berita.</td></tr>';
    }

    function hapus(idx) {
        if(confirm("Hapus berita ini selamanya?")) {
            let db = JSON.parse(localStorage.getItem('warta_final_db'));
            db.splice(idx, 1);
            localStorage.setItem('warta_final_db', JSON.stringify(db));
            init();
            if(document.getElementById('section-kelola').style.display === 'block') renderAdminTable();
        }
    }

    function init() {
        let db = JSON.parse(localStorage.getItem('warta_final_db')) || [];
        document.getElementById('stat-total').innerText = db.length;

        // Render Feed Pembaca
        let feedHtml = '';
        db.forEach((item, index) => {
            let wa = `https://api.whatsapp.com/send?text=*${encodeURIComponent(item.j)}*%0A%0ABaca di: ${window.location.href}`;
            feedHtml += `
                <div class="news-card">
                    <img src="${item.f}">
                    <div class="news-body">
                        <div class="news-meta">${item.t}</div>
                        <h2 class="news-title">${item.j}</h2>
                        <p>${item.i.substring(0, 150)}...</p>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
                            <span onclick="baca(${index})" style="color:var(--p); font-weight:bold; cursor:pointer;">Baca Selengkapnya</span>
                            <a href="${wa}" target="_blank" style="background:#25d366; color:white; padding:8px 15px; border-radius:50px; text-decoration:none; font-size:0.8rem;"><i class="fab fa-whatsapp"></i> Share WA</a>
                        </div>
                    </div>
                </div>
            `;
        });
        document.getElementById('news-feed').innerHTML = feedHtml || '<p style="text-align:center; padding:50px; color:gray;">Belum ada berita yang diterbitkan.</p>';

        // Cek Login
        if(sessionStorage.getItem('admin') === 'yes') {
            document.getElementById('admin-panel').style.display = 'block';
        }
    }

    function baca(idx) {
        let item = JSON.parse(localStorage.getItem('warta_final_db'))[idx];
        document.getElementById('full-content').innerHTML = `
            <img src="${item.f}" style="width:100%; border-radius:15px; margin-bottom:20px;">
            <p style="color:gray;">${item.t}</p>
            <h1 style="color:var(--p);">${item.j}</h1>
            <div style="white-space:pre-wrap; line-height:1.8; font-size:1.1rem;">${item.i}</div>
        `;
        document.getElementById('full-view').style.display = 'block';
        window.scrollTo(0,0);
    }

    function tutupBaca() { document.getElementById('full-view').style.display = 'none'; }

    init();
</script>
</body>
</html>
