<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARTA DESA - Media Informasi Digital</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root { --p: #064e3b; --s: #10b981; --bg: #f3f4f6; --text: #1f2937; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Navigasi */
        nav { background: var(--p); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 800; cursor: pointer; text-decoration: none; color: white; }
        .admin-trigger { color: rgba(255,255,255,0.2); cursor: pointer; font-size: 0.7rem; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

        /* Admin Dashboard */
        #admin-panel { display: none; background: white; padding: 25px; border-radius: 15px; border: 2px solid var(--s); margin-bottom: 30px; }
        .tab-btn { padding: 10px 15px; cursor: pointer; border: none; background: none; font-weight: bold; color: #666; }
        .tab-btn.active { color: var(--p); border-bottom: 2px solid var(--p); }

        /* News Cards */
        .card { background: white; border-radius: 15px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 280px; object-fit: cover; background: #ddd; }
        .card-body { padding: 20px; }
        .title { font-size: 1.6rem; margin: 10px 0; color: var(--p); font-weight: 700; line-height: 1.3; }

        /* Full View */
        #full-view { display: none; background: white; min-height: 100vh; padding: 20px 0; }
        .back-btn { background: #eee; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: inline-block; margin-bottom: 20px; font-weight: bold; border: none; }

        /* Forms */
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-pub { background: var(--p); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 0.9rem; }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">WARTA DESA</a>
    <div class="admin-trigger" onclick="mintaAkses()"><i class="fas fa-lock"></i> Admin</div>
</nav>

<div class="container" id="main-content">
    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Dashboard Admin</h3>
            <button onclick="keluar()">Logout</button>
        </div>
        <div style="margin-bottom:20px; border-bottom: 1px solid #eee;">
            <button class="tab-btn active" id="tab1" onclick="gantiTab('tulis')">Tulis Berita</button>
            <button class="tab-btn" id="tab2" onclick="gantiTab('kelola')">Kelola Berita</button>
        </div>

        <div id="view-tulis">
            <input type="text" id="j" placeholder="Judul Berita...">
            <input type="file" id="f" accept="image/*">
            <textarea id="i" rows="8" placeholder="Tulis berita lengkap di sini..."></textarea>
            <button class="btn-pub" onclick="simpanBerita()">Terbitkan Berita</button>
        </div>

        <div id="view-kelola" style="display:none;">
            <table id="tabel-admin"></table>
        </div>
    </div>

    <div id="feed"></div>
</div>

<div id="full-view">
    <div class="container">
        <button class="back-btn" onclick="kembaliKeHome()">&larr; Kembali ke Beranda</button>
        <div id="konten-berita"></div>
    </div>
</div>

<script>
    let fotoBase64 = "";
    const PASSWORD_ADMIN = "ciamis123";
    const DB_NAME = "WARTA_FINAL_FIX";

    // Konversi foto ke teks
    document.getElementById('f').addEventListener('change', function(e) {
        let r = new FileReader();
        r.onload = () => fotoBase64 = r.result;
        if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
    });

    function mintaAkses() {
        if(prompt("Masukkan Kode Akses:") === PASSWORD_ADMIN) {
            sessionStorage.setItem('isAdminActive', 'true');
            jalankanAplikasi();
        }
    }

    function keluar() {
        sessionStorage.removeItem('isAdminActive');
        window.location.href = 'index.html';
    }

    function gantiTab(t) {
        document.getElementById('view-tulis').style.display = t === 'tulis' ? 'block' : 'none';
        document.getElementById('view-kelola').style.display = t === 'kelola' ? 'block' : 'none';
        document.getElementById('tab1').classList.toggle('active', t === 'tulis');
        document.getElementById('tab2').classList.toggle('active', t === 'kelola');
        if(t === 'kelola') muatTabelAdmin();
    }

    function simpanBerita() {
        let judul = document.getElementById('j').value;
        let isi = document.getElementById('i').value;
        if(!judul || !isi) return alert("Harap isi Judul dan Berita!");

        let db = JSON.parse(localStorage.getItem(DB_NAME)) || [];
        db.unshift({
            id: Date.now(),
            judul: judul,
            isi: isi,
            foto: fotoBase64 || "https://via.placeholder.com/800x400?text=Berita+Desa",
            tgl: new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})
        });
        
        localStorage.setItem(DB_NAME, JSON.stringify(db));
        alert("Berita Berhasil Terbit!");
        window.location.href = 'index.html';
    }

    function muatTabelAdmin() {
        let db = JSON.parse(localStorage.getItem(DB_NAME)) || [];
        let html = '<tr><th>Judul</th><th>Aksi</th></tr>';
        db.forEach((item, index) => {
            html += `<tr>
                <td>${item.judul}</td>
                <td><button onclick="hapusBerita(${index})" style="color:red; cursor:pointer; border:none; background:none;">Hapus</button></td>
            </tr>`;
        });
        document.getElementById('tabel-admin').innerHTML = html;
    }

    function hapusBerita(index) {
        if(confirm("Hapus berita ini?")) {
            let db = JSON.parse(localStorage.getItem(DB_NAME));
            db.splice(index, 1);
            localStorage.setItem(DB_NAME, JSON.stringify(db));
            jalankanAplikasi();
            muatTabelAdmin();
        }
    }

    function jalankanAplikasi() {
        const db = JSON.parse(localStorage.getItem(DB_NAME)) || [];
        const params = new URLSearchParams(window.location.search);
        const idBerita = params.get('id');

        // Reset Tampilan
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('full-view').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'none';

        // 1. CEK APAKAH SEDANG MEMBUKA BERITA SPESIFIK
        if (idBerita) {
            const berita = db.find(x => x.id == idBerita);
            if (berita) {
                document.getElementById('main-content').style.display = 'none';
                document.getElementById('full-view').style.display = 'block';
                document.getElementById('konten-berita').innerHTML = `
                    <img src="${berita.foto}" style="width:100%; border-radius:15px; margin-bottom:20px;">
                    <p style="color:gray;">${berita.tgl}</p>
                    <h1 style="color:var(--p);">${berita.judul}</h1>
                    <div style="white-space:pre-wrap; line-height:1.8; font-size:1.2rem; margin-top:20px;">${berita.isi}</div>
                `;
                return;
            }
        }

        // 2. CEK STATUS ADMIN
        if (sessionStorage.getItem('isAdminActive')) {
            document.getElementById('admin-panel').style.display = 'block';
        }

        // 3. TAMPILKAN DAFTAR BERITA (FEED)
        let htmlFeed = '';
        db.forEach((item) => {
            // Link spesifik untuk share
            let linkShare = window.location.origin + window.location.pathname + "?id=" + item.id;
            let linkWA = `https://api.whatsapp.com/send?text=*${encodeURIComponent(item.judul)}*%0A%0ABaca selengkapnya di:%0A${linkShare}`;

            htmlFeed += `
                <div class="card">
                    <img src="${item.foto}">
                    <div class="card-body">
                        <small style="color:gray;">${item.tgl}</small>
                        <h2 class="title">${item.judul}</h2>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                            <a href="?id=${item.id}" style="color:var(--p); font-weight:bold; text-decoration:none;">Baca Selengkapnya</a>
                            <a href="${linkWA}" target="_blank" style="background:#25d366; color:white; padding:8px 15px; border-radius:50px; text-decoration:none; font-size:0.8rem; font-weight:bold;"><i class="fab fa-whatsapp"></i> Share WA</a>
                        </div>
                    </div>
                </div>`;
        });
        document.getElementById('feed').innerHTML = htmlFeed || '<p style="text-align:center; padding:50px; color:gray;">Belum ada berita terbit.</p>';
    }

    function kembaliKeHome() {
        window.location.href = 'index.html';
    }

    // Inisialisasi awal
    jalankanAplikasi();
</script>
</body>

    function tutupBaca() { document.getElementById('full-view').style.display = 'none'; }

    init();
</script>
</body>
</html>
